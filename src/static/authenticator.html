<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, minimum-scale=1.0, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link rel="stylesheet" href="./css/bootstrap.css">
        <link rel="stylesheet" href="./css/style.css">
        <link rel="stylesheet" href="./css/authenticator.css">
        <title>MineZone</title>
    </head>
    <body>
        <div id="close-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4096 4096">
                <path d="M4556.3,4306.8l-1746.8-1747L4555.8,813.2a176.4,176.4,0,0,0,0-249.5h0a176.4,176.4,0,0,0-249.5,0L2560,2310.2,813.7,563.8a176.4,176.4,0,0,0-249.5,0h0a176.4,176.4,0,0,0,0,249.5L2310.4,2559.8,563.7,4306.7a176.4,176.4,0,0,0,0,249.5h0a176.4,176.4,0,0,0,249.5,0L2560,2809.3l1746.8,1747a176.4,176.4,0,0,0,249.5,0h0A176.4,176.4,0,0,0,4556.3,4306.8Z" transform="translate(-512 -512)"/>
            </svg>
        </div>
        <div id="login-box" class="p-4">
            <img id="logo" class="d-block mx-auto mt-1 mb-4" src="./img/logo.png">
            <span id="title" class="h4 d-block text-center text-uppercase text-white font-weight-bold my-0">Bejelentkezés</span>
            <div id="line" class="mx-auto mt-3 mb-4"></div>
            <form id="login-form">
                <input type="text" id="username-input" class="mb-3" placeholder="Felhasználónév">
                <input type="password" id="password-input" class="mb-3" placeholder="Jelszó">
                <button id="login-btn" class="text-uppercase text-white w-100">Belépés</button>
            </form>
            <div id="login-options-container" class="small text-right text-light mt-3">
                <span>Még nincs fiókod? <a id="register-link" href="#">Regisztráció</a></span><br/>
                <span>Elfelejtetted jelszavad? <a id="password-reminder-link" href="#">Jelszóemlékeztető</a></span>
            </div>
        </div>
        <script src="./js/index.js"></script>
        <script src="./js/authenticator.js"></script>
    </body>
</html>
